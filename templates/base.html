<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{{ brand_name }}{% endblock %}</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/logo.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='img/logo.png') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
    <!-- KaTeX for Beautiful Mathematical Formula & Equation Rendering -->
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/katex/katex.min.css') }}">
    <script src="{{ url_for('static', filename='vendor/katex/katex.min.js') }}"></script>
    <script src="{{ url_for('static', filename='vendor/katex/auto-render.min.js') }}"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        if (typeof lucide === "undefined") {
            document.write('<script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.js"><\/script>');
        }
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}?v=4.0">
</head>
<body>
    {% block body %}{% endblock %}
    <script src="{{ url_for('static', filename='js/app.js') }}?v=4.0"></script>
    <script>
        if (typeof lucide !== "undefined" && typeof lucide.createIcons === "function") {
            lucide.createIcons();
        }
    </script>
</body>
</html>
